x-app: &app
  image: secops-assistido:dev
  working_dir: /app
  user: "1000:1000"
  volumes:
    - ./:/app
  environment:
    SECOPS_DATA_DIR: /app/data
    WATCHFILES_FORCE_POLLING: "true"
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}

services:
  dev:
    <<: *app
    pull_policy: never
    profiles: ["dev"]
    command: sleep infinity

  api:
    <<: *app
    pull_policy: never
    build: .
    command: uvicorn secops_core.api:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "${API_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    <<: *app
    pull_policy: never
    command: >
      streamlit run src/secops_core/dashboard.py
      --server.address=0.0.0.0 --server.port=8501
      --server.runOnSave=true --server.fileWatcherType=auto
    environment:
      SECOPS_DATA_DIR: /app/data
      SECOPS_API_URL: http://api:8000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ollama:
