[project]
name = "secops-assistido"
version = "0.1.0"
description = "SecOps assistido: deteccao de anomalias em logs (Modo A local)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.40",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "watchfiles>=0.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
